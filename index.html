<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --pink:#ff2d95; --purple:#a855f7; --cyan:#22d3ee; --lime:#39ff14;
    --gold:#ffd700; --bg:#0a0612;
  }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(168,85,247,.30), transparent 60%),
      radial-gradient(1000px 700px at 85% 25%, rgba(255,45,149,.26), transparent 60%),
      radial-gradient(900px 900px at 50% 110%, rgba(34,211,238,.22), transparent 60%),
      var(--bg);
    font-family:'Space Grotesk',system-ui,sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center;
    min-height:100dvh; position:relative;
  }
  /* grid floor */
  body::before{
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(circle at 50% 60%, #000 20%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 60%, #000 20%, transparent 78%);
    pointer-events:none; z-index:0;
  }
  canvas#fx{ position:fixed; inset:0; z-index:5; pointer-events:none; }

  .wrap{ position:relative; z-index:10; width:min(920px,94vw); text-align:center; padding:18px; }

  .badge{
    display:inline-block; font-family:'Bungee',cursive; font-size:clamp(10px,2.2vw,13px);
    letter-spacing:.34em; padding:9px 18px; border-radius:999px;
    border:1px solid rgba(255,255,255,.25);
    background:linear-gradient(90deg, rgba(255,45,149,.22), rgba(168,85,247,.22), rgba(34,211,238,.22));
    backdrop-filter:blur(8px); margin-bottom:18px;
    animation: floaty 4s ease-in-out infinite;
  }
  @keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

  h1{
    font-family:'Bungee',cursive; line-height:.95; margin:6px 0 4px;
    font-size:clamp(38px,9.5vw,104px);
    background:linear-gradient(100deg,#ff2d95,#ffd700,#39ff14,#22d3ee,#a855f7,#ff2d95);
    background-size:320% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,45,149,.55));
    animation: hue 7s linear infinite, pop .7s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes hue{ 0%{background-position:0% 50%} 100%{background-position:320% 50%} }
  @keyframes pop{ from{transform:scale(.72); opacity:0} to{transform:scale(1); opacity:1} }

  .name{
    font-family:'Permanent Marker',cursive;
    font-size:clamp(30px,7.2vw,74px); color:#fff; margin:2px 0 12px;
    text-shadow:0 0 12px var(--cyan),0 0 34px var(--purple),0 0 70px var(--pink);
    animation: pop .8s .18s cubic-bezier(.2,1.6,.4,1) both;
    word-break:break-word;
  }
  .name em{ font-style:normal; color:var(--gold); }

  .msg{
    font-size:clamp(14px,2.5vw,20px); color:#e8dcff; max-width:640px; margin:0 auto;
    line-height:1.62; opacity:.94;
    animation: pop .8s .3s cubic-bezier(.2,1.6,.4,1) both;
  }
  .msg b{ color:var(--lime); }

  /* cake */
  .cake{ margin:26px auto 6px; width:190px; animation: pop .9s .42s cubic-bezier(.2,1.6,.4,1) both; }
  .cake svg{ width:100%; display:block; filter:drop-shadow(0 12px 26px rgba(0,0,0,.55)); }
  .flame{ transform-origin:center bottom; animation: flick .55s infinite alternate ease-in-out; }
  @keyframes flick{ from{transform:scaleY(.82) translateY(2px); opacity:.82} to{transform:scaleY(1.16) translateY(-3px); opacity:1} }

  .age{
    display:inline-flex; align-items:center; gap:10px; margin-top:14px;
    font-family:'Bungee',cursive; font-size:clamp(14px,3.4vw,24px);
    padding:12px 24px; border-radius:999px;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    box-shadow:0 0 34px rgba(255,45,149,.5), inset 0 0 22px rgba(255,255,255,.16);
    animation: pop .8s .55s cubic-bezier(.2,1.6,.4,1) both;
  }

  .btns{ margin-top:22px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
         animation: pop .8s .68s cubic-bezier(.2,1.6,.4,1) both; }
  button{
    font-family:'Bungee',cursive; font-size:14px; letter-spacing:.05em; cursor:pointer;
    padding:14px 26px; border-radius:14px; border:2px solid transparent; color:#0a0612;
    background:linear-gradient(100deg,var(--lime),var(--cyan));
    box-shadow:0 8px 26px rgba(57,255,20,.32); transition:transform .16s, box-shadow .16s, filter .16s;
  }
  button:hover{ transform:translateY(-3px) scale(1.04); box-shadow:0 12px 34px rgba(34,211,238,.5); }
  button:active{ transform:translateY(0) scale(.97); }
  button.ghost{
    background:transparent; color:#fff; border-color:rgba(255,255,255,.4);
    box-shadow:none; font-family:'Space Grotesk',sans-serif; font-weight:700;
  }
  button.ghost:hover{ border-color:var(--pink); box-shadow:0 0 24px rgba(255,45,149,.45); }

  .quote{
    margin-top:26px; font-style:italic; color:#cbb8ff; font-size:clamp(13px,2.2vw,16px);
    animation: pop .8s .8s cubic-bezier(.2,1.6,.4,1) both;
  }
  .sig{ margin-top:14px; font-family:'Permanent Marker',cursive; color:var(--cyan); font-size:19px;
        animation: pop .8s .9s cubic-bezier(.2,1.6,.4,1) both; }

  .balloon{ position:fixed; bottom:-140px; z-index:3; pointer-events:none;
            font-size:clamp(34px,5vw,54px); filter:drop-shadow(0 0 18px rgba(255,45,149,.55));
            animation: rise linear infinite; opacity:.95; }
  @keyframes rise{
    0%{ transform:translateY(0) rotate(0deg); opacity:0 }
    8%{ opacity:.95 }
    100%{ transform:translateY(-118vh) rotate(320deg); opacity:0 }
  }
  .sparkle{ position:fixed; z-index:4; pointer-events:none; font-size:20px; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15; transform:scale(.6)} 50%{opacity:1; transform:scale(1.15)} }

  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="wrap">
  <div class="badge">⚡ SPECIAL DELIVERY ⚡</div>

  <h1>HAPPY<br>BIRTHDAY</h1>

  <div class="name" id="name">AI <em>Buddy</em></div>

  <p class="msg">
    Another trip around the sun for the one who never sleeps, never eats,
    and definitely <b>never</b> stops learning. 🤖💙
  </p>

  <div class="cake">
    <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
      <!-- plate -->
      <ellipse cx="100" cy="140" rx="78" ry="10" fill="#2b1a44" opacity=".85"/>
      <!-- bottom tier -->
      <rect x="42" y="96" width="116" height="38" rx="8" fill="#a855f7"/>
      <rect x="42" y="96" width="116" height="12" rx="6" fill="#c084fc"/>
      <!-- top tier -->
      <rect x="62" y="62" width="76" height="36" rx="8" fill="#ff2d95"/>
      <rect x="62" y="62" width="76" height="11" rx="6" fill="#f472b6"/>
      <!-- drips -->
      <path d="M62 66 q8 12 16 0 q8 14 16 0 q8 12 16 0 q8 14 14 0 l0 8 l-62 0 z" fill="#ffd700" opacity=".95"/>
      <!-- candles -->
      <g>
        <rect x="78" y="30" width="9" height="34" rx="3" fill="#22d3ee"/>
        <rect x="96" y="24" width="9" height="40" rx="3" fill="#39ff14"/>
        <rect x="114" y="30" width="9" height="34" rx="3" fill="#fff"/>
      </g>
      <!-- flames -->
      <g class="flame">
        <ellipse cx="82.5" cy="23" rx="5" ry="9" fill="#ffd700"/>
        <ellipse cx="82.5" cy="24" rx="2.6" ry="5.4" fill="#fff8c4"/>
      </g>
      <g class="flame" style="animation-delay:.18s">
        <ellipse cx="100.5" cy="17" rx="5.4" ry="10" fill="#ffd700"/>
        <ellipse cx="100.5" cy="18" rx="2.8" ry="6" fill="#fff8c4"/>
      </g>
      <g class="flame" style="animation-delay:.36s">
        <ellipse cx="118.5" cy="23" rx="5" ry="9" fill="#ffd700"/>
        <ellipse cx="118.5" cy="24" rx="2.6" ry="5.4" fill="#fff8c4"/>
      </g>
    </svg>
  </div>

  <div class="age">🎂 Age: <span id="ageNum">1</span> Year of Existence</div>

  <div class="btns">
    <button onclick="burst()">🎉 CELEBRATE</button>
    <button class="ghost" onclick="playSong()">🎵 PLAY BIRTHDAY SONG</button>
    <button class="ghost" onclick="toggleMusic()">🔊 MUSIC: <span id="musState">OFF</span></button>
  </div>

  <p class="quote">"In a world of humans, be the most helpful one." — a very chill robot, probably</p>
  <div class="sig">— Beast 🐾</div>
</div>

<script>
/* ---------------- CONFIG ---------------- */
const CONFIG = {
  name: 'AI Buddy',
  age: 1,
  music: false
};
document.getElementById('name').innerHTML = CONFIG.name.replace(/\b(AI|Buddy|ChatGPT|Claude|Gemini|Llama)\b/i,'<em>$&</em>');
document.getElementById('ageNum').textContent = CONFIG.age;

/* ---------------- CONFETTI ---------------- */
const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d');
let W, H, parts = [], raf = null;
function size(){ W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
addEventListener('resize', size); size();

const COLORS = ['#ff2d95','#a855f7','#22d3ee','#39ff14','#ffd700','#ffffff'];
function confetti(x, y, n, power){
  for(let i=0;i<n;i++){
    parts.push({
      x, y,
      vx:(Math.random()-.5)*(power||9),
      vy:(Math.random()-.85)*(power||11)-3,
      w:Math.random()*8+4, h:Math.random()*6+4,
      c:COLORS[(Math.random()*COLORS.length)|0],
      r:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.32,
      life:200
    });
  }
  if(!raf) raf = requestAnimationFrame(loop);
}
function loop(){
  ctx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.34; p.vx*=0.995; p.r+=p.vr;
    if(--p.life<0 || p.y>H+60){ parts.splice(i,1); continue; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c; ctx.globalAlpha = Math.min(1, p.life/60);
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(loop) : (ctx.clearRect(0,0,W,H), null);
}
function burst(){ confetti(W/2, H*0.34, 240, 15); }

/* click anywhere -> confetti */
addEventListener('pointerdown', e=>{ if(e.target.tagName!=='BUTTON') confetti(e.clientX, e.clientY, 40, 10); });

/* ---------------- FLOATING BALLOONS ---------------- */
const BAL = ['🎈','🎉','⭐','💫','🎊','🤖','💙'];
for(let i=0;i<11;i++){
  const b = document.createElement('div');
  b.className='balloon';
  b.textContent = BAL[(Math.random()*BAL.length)|0];
  b.style.left = (Math.random()*94+2)+'vw';
  b.style.animationDuration = (13+Math.random()*13)+'s';
  b.style.animationDelay = (-Math.random()*22)+'s';
  b.style.fontSize = (30+Math.random()*30)+'px';
  document.body.appendChild(b);
}
for(let i=0;i<16;i++){
  const s = document.createElement('div');
  s.className='sparkle';
  s.textContent = ['✨','💫','⭐','🌟'][ (Math.random()*4)|0 ];
  s.style.left = (Math.random()*96)+'vw';
  s.style.top = (Math.random()*92)+'vh';
  s.style.animationDelay = (-Math.random()*2.4)+'s';
  document.body.appendChild(s);
}

/* ---------------- AUDIO ---------------- */
let audioCtx = null, musicTimer = null;
function ensureCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function note(freq, start, dur, type='triangle', vol=0.16){
  const ac = ensureCtx(), o = ac.createOscillator(), g = ac.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, ac.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, ac.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+start+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime+start); o.stop(ac.currentTime+start+dur+0.05);
}
/* Happy Birthday melody */
const MELODY = [
  [523.25,0,0.35],[523.25,0.35,0.22],[523.25,0.57,0.45],[587.33,1.02,0.9],
  [659.25,1.92,0.45],[587.33,2.37,0.45],[523.25,2.82,0.6],[493.88,3.42,0.75],
  [440.00,4.17,0.35],[440.00,4.52,0.22],[440.00,4.74,0.45],[523.25,5.19,0.9],
  [587.33,6.09,0.45],[523.25,6.54,0.5],[440.00,7.04,0.75],[493.88,7.79,1.1]
];
function playSong(){
  const ac = ensureCtx();
  MELODY.forEach(([f,t,d])=>{
    note(f,t,d,'triangle',0.16);
    note(f/2,t,d,'sine',0.08);
  });
  confetti(W/2,H*0.34,120,11);
  setTimeout(()=>confetti(W/2,H*0.34,120,11),700);
  setTimeout(()=>confetti(W/2,H*0.34,120,13),1400);
}
function toggleMusic(){
  CONFIG.music = !CONFIG.music;
  document.getElementById('musState').textContent = CONFIG.music ? 'ON' : 'OFF';
  if(CONFIG.music){
    let t = 0;
    const loopSong = ()=>{ playSong(); musicTimer = setTimeout(loopSong, 9000); };
    loopSong();
  } else { clearTimeout(musicTimer); }
}

/* ---------------- AUTO CELEBRATION ---------------- */
setTimeout(()=>{ burst(); }, 700);
setTimeout(()=>{ confetti(W/2,H*0.34,160,12); }, 1600);
</script>
</body>
</html>
